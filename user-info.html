<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User information</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="page-body">

  <header class="main-header">
    <nav class="main-nav">
      <a class="nav-link" href="events.html">Events</a>
      <a class="nav-link" href="users.html">Users</a>
      <a class="nav-link" href="index.html">Logout</a>
    </nav>
  </header>

  <main class="main-content">
    <section class="user-profile-section">
      <h2 class="section-title">user profile</h2>
      
      <article class="profile-card">
        <img class="profile-avatar" src="assets/profile-avatar.png" alt="user profile avatar image">
        <div class="profile-info">
          <p class="info-row"><span class="info-label">Username:</span> john_doe</p>
          <p class="info-row"><span class="info-label">Role:</span> admin</p>
          <p class="info-row"><span class="info-label">Status:</span> active</p>
          <p class="info-row"><span class="info-label">Registered:</span> january 15, 2026</p>
        </div>
        
        <div class="profile-actions">
          <a class="btn-primary" href="edit-user.html">Edit profile</a>
          <button class="btn-danger" type="button">Delete user</button>
        </div>
      </article>
    </section>

    <dialog class="delete-confirmation-dialog" open>
      <div class="dialog-content">
        <h3 class="dialog-title">Delete user</h3>
        <p class="dialog-text">Are you sure you want to delete this user? this action cannot be undone.</p>
        <div class="dialog-actions">
          <button class="btn-danger" type="button">Confirm delete</button>
          <button class="btn-secondary" type="button">Cancel</button>
        </div>
      </div>
    </dialog>
  </main>

  <footer class="main-footer">
    <p class="footer-text">calendar application</p>
  </footer>

</body>
</html>
