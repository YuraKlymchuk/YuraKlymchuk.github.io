<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create or edit event</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="page-body">

  <header class="main-header">
    <a href="events.html" style="text-decoration: none;"><h1 class="logo-title">Event Calendar</h1></a>
    <nav class="main-nav">
      <a class="nav-link" href="events.html">Events</a>
      <a class="nav-link" href="users.html">Users</a>
      <a class="nav-link" href="index.html">Logout</a>
    </nav>
  </header>

  <main class="main-content">
    <section class="event-form-section">
      <form class="event-form" action="meetup-details.html">
        <h2 class="form-title">Event details</h2>
        
        <span class="validation-error">Please fill in all required fields.</span>

        <div class="form-group">
          <label class="form-label" for="event-title">Event title</label>
          <input class="form-input" type="text" id="event-title" placeholder="enter event name">
        </div>

        <div class="form-group">
          <label class="form-label" for="event-date">Date and time</label>
          <input class="form-input" type="datetime-local" id="event-date">
        </div>

        <div class="form-group">
          <label class="form-label" for="event-description">Description</label>
          <textarea class="form-input" id="event-description" rows="5" placeholder="describe your event"></textarea>
        </div>

        <div class="form-actions">
          <button class="btn-primary" type="submit">Save event</button>
          <a href="events.html"><button class="btn-secondary" type="button">Cancel</button></a>
        </div>
      </form>
    </section>
  </main>
  <script src="js/main.js"></script>
</body>
</html>
