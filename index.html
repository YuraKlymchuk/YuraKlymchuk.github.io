<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>login - event calendar</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="page-body">

  <header class="main-header">
    <h1 class="logo-title">event calendar service</h1>
  </header>

  <main class="main-content">
    <div class="error-notification">
      <p class="error-text">invalid credentials provided. please try again.</p>
    </div>

    <section class="login-section">
      <form class="login-form" action="events.html">
        <h2 class="form-title">sign in</h2>
        
        <div class="form-group">
          <label class="form-label" for="username">username</label>
          <input class="form-input" type="text" id="username" name="username">
          <span class="validation-error">username is required</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">password</label>
          <input class="form-input" type="password" id="password" name="password">
        </div>

        <button class="btn-primary" type="submit">login</button>
      </form>
    </section>
  </main>

  <footer class="main-footer">
    <p class="footer-text">calendar application</p>
  </footer>

</body>
</html>
